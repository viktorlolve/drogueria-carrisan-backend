name: Shorts previews - generar

on:
  schedule:
    # Diario. El costo lo pone el tope de 24 clips por corrida, no la frecuencia;
    # con cada 48h la cola de videos nuevos se acumulaba mas rapido de lo que se
    # drenaba. Además el script corta solo si detecta bloqueo por IP.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

# Una sola corrida a la vez: dos procesos compitiendo por los mismos pendientes
# duplican descargas y subidas al mismo objeto de Storage.
concurrency:
  group: shorts-previews
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar yt-dlp (grupo default incluye yt-dlp-ejs para el n-challenge)
        run: pip install -U "yt-dlp[default]"

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias del backend
        run: npm install

      - name: Generar previews pendientes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_CHANNEL_IDS: ${{ secrets.YOUTUBE_CHANNEL_IDS }}
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
        run: node scripts/shorts-previews-generar.mjs
